{% extends 'base.html' %}

{% block content %}
<section class="hero-section">
    <div class="tag-pill" style="background-color: #e0f2fe; color: #0284c7;">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Remoção do Fundo de Fotos por IA
    </div>

    <div class="search-card" style="max-width: 620px;">
        <form id="bgForm" enctype="multipart/form-data">
            <div class="dropzone-container" onclick="document.getElementById('imageInput').click();">
                <i class="fa-solid fa-cloud-arrow-up text-secondary fs-1 mb-3"></i>
                <h5 class="fw-bold mb-1">Clique para selecionar uma imagem</h5>
                <p class="text-muted small mb-0" id="fileNameDisplay">Formatos suportados: PNG, JPG, WEBP</p>
                <input type="file" id="imageInput" name="image" accept="image/*" class="d-none" required onchange="updateFileName(this)">
            </div>

            <button type="submit" class="btn-download w-100 justify-content-center mt-3 py-3">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Processar e Remover Fundo
            </button>
        </form>
    </div>
</section>

<script>
    function updateFileName(input) {
        if (input.files && input.files[0]) {
            document.getElementById('fileNameDisplay').innerText = "Arquivo selecionado: " + input.files[0].name;
        }
    }

    document.getElementById('bgForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const formData = new FormData(this);
        document.getElementById('loaderTitle').innerText = "Removendo o Fundo";
        document.getElementById('loaderSubtitle').innerText = "Enviando imagem para o servidor...";
        document.getElementById('progressBar').style.width = '0%';
        document.getElementById('progressBar').innerText = '0%';

        try {
            const response = await fetch('/start-remove-bg', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            if (data.task_id) {
                trackProgress(data.task_id);
            } else {
                alert(data.error || "Erro ao iniciar o processamento.");
            }
        } catch (err) {
            alert("Ocorreu um erro ao conectar com o servidor.");
        }
    });
</script>
{% endblock %}
