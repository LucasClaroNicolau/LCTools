<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <title>Remover Fundo - LC Tools</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-red: #ff0033;
            --primary-red-hover: #e0002d;
            --bg-gradient: linear-gradient(180deg, #fff5f5 0%, #ffffff 40%, #f8f9fa 100%);
            --text-main: #111827;
            --text-muted: #6b7280;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar-custom {
            padding: 1.2rem 0;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .brand-logo {
            font-weight: 800;
            font-size: 1.6rem;
            color: #000;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo .badge-lc {
            background: var(--primary-red);
            color: #fff;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .hero-section {
            padding: 60px 0 40px;
            text-align: center;
        }

        .tag-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #ffe6e9;
            color: var(--primary-red);
            font-weight: 700;
            font-size: 0.82rem;
            padding: 6px 14px;
            border-radius: 50px;
            margin-bottom: 20px;
        }

        .hero-subtitle {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 620px;
            margin: 0 auto 36px;
            line-height: 1.6;
        }

        .search-card {
            background: #ffffff;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(255, 0, 51, 0.12), 0 0 20px rgba(0,0,0,0.03);
            border: 1px solid #f3f4f6;
            max-width: 620px;
            margin: 0 auto;
        }

        .btn-download {
            background: var(--primary-red);
            color: #ffffff;
            font-weight: 700;
            padding: 12px 28px;
            border-radius: 14px;
            border: none;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 18px rgba(255, 0, 51, 0.3);
            transition: all 0.2s ease;
        }

        .btn-download:hover {
            background: var(--primary-red-hover);
            transform: translateY(-1px);
            color: white;
        }

        .dropzone-container {
            border: 2px dashed #d1d5db;
            border-radius: 20px;
            padding: 40px 20px;
            background: #fafafa;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dropzone-container:hover {
            border-color: var(--primary-red);
            background: #fff0f2;
        }

        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .loader-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .loader-box {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            max-width: 400px;
            width: 90%;
        }

        .custom-spinner {
            width: 3.5rem;
            height: 3.5rem;
            color: var(--primary-red);
            border-width: 0.35em;
        }

        footer {
            margin-top: auto;
            padding: 24px 0;
            border-top: 1px solid #f3f4f6;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container justify-content-center">
            <a class="brand-logo" href="/">
                <span class="badge-lc">LC</span> Tools
            </a>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Overlay do Loader -->
    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader-box">
            <div class="spinner-border custom-spinner mb-3" role="status">
                <span class="visually-hidden">Processando...</span>
            </div>
            <h5 class="fw-bold text-dark mb-1" id="loaderTitle">Processando...</h5>
            <p class="text-muted small mb-3" id="loaderSubtitle">Aguarde enquanto processamos seu arquivo.</p>

            <div class="progress rounded-pill" style="height: 22px; background-color: #e5e7eb;">
                <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-danger"
                     role="progressbar" style="width: 0%; font-weight: 700; font-size: 0.85rem;"
                     aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p class="mb-0">© LC Tools - Desenvolvido por <strong>Lucas Claro</strong>.</p>
            <p>Arquivos temporários excluídos automaticamente a cada 5 minutos.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function trackProgress(taskId) {
            const overlay = document.getElementById('loaderOverlay');
            const progressBar = document.getElementById('progressBar');
            const titleEl = document.getElementById('loaderTitle');
            const subtitleEl = document.getElementById('loaderSubtitle');

            overlay.classList.add('active');

            const interval = setInterval(async () => {
                try {
                    const response = await fetch(`/progress/${taskId}`);
                    const data = await response.json();

                    if (data.progress !== undefined) {
                        progressBar.style.width = `${data.progress}%`;
                        progressBar.innerText = `${data.progress}%`;
                    }

                    if (data.msg) {
                        subtitleEl.innerText = data.msg;
                    }

                    if (data.status === 'completed') {
                        clearInterval(interval);
                        progressBar.style.width = '100%';
                        progressBar.innerText = '100%';
                        titleEl.innerText = "Concluído com Sucesso!";
                        subtitleEl.innerText = "Baixando imagem...";

                        window.location.href = `/get-file/${taskId}`;

                        setTimeout(() => {
                            overlay.classList.remove('active');
                            progressBar.style.width = '0%';
                            progressBar.innerText = '0%';
                        }, 2500);
                    } else if (data.status === 'error') {
                        clearInterval(interval);
                        overlay.classList.remove('active');
                        alert(`Erro: ${data.error || 'Ocorreu uma falha no processamento.'}`);
                    }
                } catch (err) {
                    console.error("Erro no polling de progresso:", err);
                }
            }, 800);
        }
    </script>
</body>
</html>
